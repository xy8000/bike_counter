[package]
name = "bike_counter"
version = "0.0.1"
edition = "2024"

[dependencies]
chrono = "0.4"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1"] }
refinery = { version = "0.8", features = ["postgres"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
uuid = "1.0"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }