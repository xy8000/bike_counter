# Compose override used only by the Playwright e2e run (`make test-playwright` via
# scripts/e2e-playwright.sh). It is layered on top of docker-compose.yml:
#
#   * mounts the committed SQL fixture so the database is seeded on its fresh
#     volume (Postgres runs it from docker-entrypoint-initdb.d),
#   * points the backend healthcheck at `/health/live` so readiness never pings
#     the data providers — the e2e run is fully offline (data comes from the seed;
#     the HTTP server only binds after migrations + tiles + startup sync, so a
#     healthy `/health/live` already implies those are done).
#
# The e2e run is isolated from the development data: `db` and `minio` use the
# dedicated `postgres_data_e2e` / `minio_data_e2e` volumes instead of the dev
# `postgres_data` / `minio_data`, and the dev volumes are removed from the merged
# config. `scripts/e2e-playwright.sh` drops the e2e volumes with `down -v` before
# and after the run, so a fresh seeded database is guaranteed every time — while
# the development `postgres_data` / `minio_data` volumes are never touched.
services:
  db:
    volumes:
      - postgres_data_e2e:/var/lib/postgresql
      - ./scripts/e2e-seed.sql:/docker-entrypoint-initdb.d/e2e-seed.sql:ro

  minio:
    volumes:
      - minio_data_e2e:/data

  backend:
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 60

volumes:
  postgres_data_e2e:
  minio_data_e2e:
  # Remove the development volumes from the merged config so `docker compose
  # down -v` can never delete them during an e2e run.
  postgres_data: !reset null
  minio_data: !reset null
