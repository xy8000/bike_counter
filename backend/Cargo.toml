[package]
name = "bike_counter"
version = "0.0.9"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Only the plain Arrow arrays/schema/record batches are used, not the `csv`,
# `json` or `ipc` default codecs (see
# adapter/driven/opendata_file_generator.rs), so the default features are off.
arrow = { version = "60.0.0", default-features = false }
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
csv = "1.4.0"
flate2 = "1.1.10"
futures = "0.3.34"
include_dir = "0.7.4"
# `openssl` is pulled in transitively by rust-s3 (native-tls). The `vendored`
# feature compiles a static OpenSSL from source, which is required for the
# fully-static musl Docker build (Alpine's openssl-dev ships only shared libs).
openssl = { version = "0.10.81", features = ["vendored"] }
# Default features (brotli, lz4, zstd, flate2-zlib-rs, simdutf8) are dropped:
# the only compression the parquet writer uses is SNAPPY.
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
refinery = { version = "0.10.0", features = ["postgres"] }
rust-s3 = { version = "0.38.0", features = ["with-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8+spec-1.1.0"
# HTTP middleware (request ids, tracing spans, timeouts, body limits,
# panic isolation) and the concurrency limit that bounds work queued behind
# the blocking DB pool. No `compression-gzip`: nginx compresses at the edge so
# the BFF's strong ETag stays computed over the uncompressed body.
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.6.8", features = [
    "catch-panic",
    "limit",
    "request-id",
    "set-header",
    "timeout",
    "trace",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "time"] }
ureq = "3.5.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4", "v5", "serde"] }
# Only plain (flate2-based) deflate archives are read and written by the
# Münster importer; the default features would add aes-crypto, bzip2, deflate64,
# lzma, ppmd, time, zstd and xz (four extra C toolchain builds).
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
http-body-util = "0.1.5"
# `testcontainers-modules` 0.15 (latest) pins `testcontainers ^0.27`, so the
# latest stable combination is kept at 0.27.
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

# Build-speed tuning (see plans/163_rust_build_time_optimization_plan.md).
# `debug = "line-tables-only"` keeps file/line information for our own backtraces
# while dropping the type/variable DWARF, and the dependency override removes the
# bulk of the multi-GB debug artifacts; the `test` profile is tuned separately
# because `cargo test` / `cargo llvm-cov` do not inherit `package` overrides.
# `release` is deliberately untouched so shipped binaries keep their symbols.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
