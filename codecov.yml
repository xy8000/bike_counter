# Codecov configuration for xy8000/bike_counter.
#
# Coverage is uploaded by .github/workflows/ci.yml from two lcov reports:
#   * backend  — Rust production-only line coverage (cargo-llvm-cov + the
#     scripts/lcov-production-only.sh filter, matching the make coverage gate)
#   * frontend — TypeScript pure-logic modules covered by the Vitest unit suite
#
# Reporting is intentionally informational for now: nothing here can fail a
# pull request. The strict local gates stay `make coverage` (Rust) and
# `make test-unit` (frontend), see agents.md.
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto # compare against the base commit's coverage of the same flag
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

flags:
  backend:
    carryforward: true
  frontend:
    carryforward: true

ignore:
  - "backend/target"
  - "frontend/node_modules"
  - "frontend/dist"
  - "frontend/coverage"
  - "tiles"
