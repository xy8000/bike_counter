# Codecov configuration for xy8000/bike_counter.
#
# Coverage is uploaded by .github/workflows/ci.yml from two lcov reports:
#   * backend  — Rust production-only line coverage (cargo-llvm-cov + the
#     scripts/lcov-production-only.sh filter, matching the make coverage gate)
#   * frontend — the whole frontend/src covered by the Vitest unit suite (jsdom,
#     React components included; the ≥ 80 % whole-src gate lives in
#     frontend/vitest.config.ts)
#
# Both flags are mandated by Codecov: the per-flag project status below
# enforces ≥ 80 % coverage and can fail a pull request, mirroring the local
# `make coverage` gate (backend + frontend, see agents.md).
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      backend:
        target: 80%
        threshold: 1%
        flags:
          - backend
      frontend:
        target: 80%
        threshold: 1%
        flags:
          - frontend

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

flags:
  backend:
    carryforward: true
  frontend:
    carryforward: true

ignore:
  - "backend/target"
  - "frontend/node_modules"
  - "frontend/dist"
  - "frontend/coverage"
  - "tiles"
