services:
  db:
    # Postgres 18 (latest stable major). Upgrading a major version does NOT
    # migrate an existing `postgres_data` volume in place: re-create the volume
    # (`docker compose down -v`) or migrate the data manually.
    image: postgres:18-alpine
    container_name: bike_counter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bike_counter
    volumes:
      - postgres_data:/var/lib/postgresql
    # Reachable only from within the dedicated internal `db_network`
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bike_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Published image name (see .github/workflows/release.yml). The `build:`
    # block stays alongside `image:` so `docker compose up --build` (make run)
    # keeps building from source for development, while `docker compose pull`
    # fetches the released image.
    image: xy8000/bike-counter-backend:0.0.7
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike_counter_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    volumes:
      - ./config.toml:/app/config.toml:ro
      # Host tiles dir, writable so the backend can build the basemap; the
      # frontend mounts the same dir read-only.
      - ./tiles:/data
    ports:
      - "8080:8080"
    networks:
      - default
      - asset_network
      - db_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Private S3-compatible object storage (Garage) for counting-station images
  # and the immutable opendata files. Reachable only from within the dedicated
  # internal `asset_network` (i.e. only the backend); no host port is published.
  # The backend streams content to the browser via the BFF, so Garage is never
  # exposed directly.
  garage:
    # Pinned: Garage's config/CLI surface changes between releases. The image is
    # `FROM scratch` (no shell), so the two buckets are created by the backend
    # over the S3 API instead of by a `mc`-style init container.
    image: dxflrs/garage:v2.4.1
    container_name: bike_counter_garage
    restart: unless-stopped
    # --single-node auto-creates the cluster layout (needs replication_factor =
    # 1 in garage/garage.toml); --default-access-key creates the S3 key from the
    # GARAGE_DEFAULT_* variables below with the create-bucket permission, so the
    # backend can create both buckets itself.
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: garageadmin
      GARAGE_DEFAULT_SECRET_KEY: garageadmin-secret
      # The image defaults to `garage=info`, which logs one info line per admin
      # API request — and the healthcheck below queries the node every 5s. Keep
      # warnings/errors only so the container log stays quiet.
      RUST_LOG: garage=warn
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - asset_network
    healthcheck:
      # The image ships neither a shell nor curl, so probe with the bundled CLI
      # (the documented way to query a running node).
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    # Published image name (see .github/workflows/release.yml); `build:` stays
    # for local development via `docker compose up --build` (make run).
    image: xy8000/bike-counter-frontend:0.0.7
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bike_counter_frontend
    restart: unless-stopped
    depends_on:
      # Wait for the backend to be fully ready. The backend reports ready (and
      # starts its HTTP server) once the database is migrated and the startup
      # sync is done — the basemap is built in the background afterwards. The
      # frontend starts immediately and shows a loading state until
      # tiles/map.pmtiles appears in the shared ./tiles mount.
      backend:
        condition: service_healthy
    volumes:
      - ./tiles:/usr/share/nginx/html/tiles:ro
    ports:
      # The container serves on 8080 (nginx runs unprivileged, see
      # frontend/Dockerfile); the host port stays 8081.
      - "8081:8080"
    healthcheck:
      # `localhost` resolves to IPv6 `::1` in the nginx alpine image while nginx
      # only listens on IPv4 (`listen 8080`), so probe 127.0.0.1 explicitly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # Internal network shared only by the backend and Garage. `internal: true`
  # disables external access and, together with explicit network membership,
  # keeps Garage unreachable from db/frontend on the default network.
  asset_network:
    internal: true
  # Internal network shared only by the backend and PostgreSQL. `internal: true`
  # plus explicit membership keeps the database unreachable from garage/frontend
  # and from the host (no published port).
  db_network:
    internal: true

volumes:
  postgres_data:
  garage_meta:
  garage_data:
