services:
  db:
    image: postgres:16-alpine
    container_name: bike_counter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bike_counter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bike_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike_counter_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "8080:8080"
    networks:
      - default
      - asset_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Private S3-compatible object storage for counting-station images. Reachable
  # only from within the dedicated internal `asset_network` (i.e. only the
  # backend); no host port is published. The backend streams image content to
  # the browser via the BFF, so MinIO is never exposed directly.
  minio:
    image: minio/minio:latest
    container_name: bike_counter_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - asset_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket provisioning using the MinIO client (`mc`). The backend
  # waits for it to finish before starting, so the image bucket always exists.
  minio-init:
    image: minio/mc:latest
    container_name: bike_counter_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - asset_network
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bike-counter-images
      "

  # One-shot init container that produces `tiles/map.pmtiles`: a single static
  # PMTiles archive combining a coarse worldwide backdrop (z0-5, real
  # coastlines everywhere) with Germany OSM detail (z6-15). Both pieces are
  # *extracted* (not downloaded in full) from the public Protomaps basemap via
  # HTTP range requests, using the official `pmtiles` CLI
  # (github.com/protomaps/go-pmtiles) — see tiles/README.md. The frontend
  # serves the resulting file directly as a static asset (nginx); MapLibre
  # reads tiles out of it via range requests (the `pmtiles` npm package), so
  # there is no tile-server process and no BFF tile proxy. Skips when
  # tiles/map.pmtiles already exists (cached across runs); SKIP_TILES=1 (e.g.
  # the e2e) skips it entirely.
  tiles:
    image: alpine:3.20
    container_name: bike_counter_tiles_init
    restart: "no"
    environment:
      - SKIP_TILES
      # A dated Protomaps daily build (see maps.protomaps.com/builds). Pinned
      # rather than "latest" because Protomaps publishes dated snapshots, not
      # a stable alias, and explicitly discourages hotlinking; bump this
      # periodically (tiles/README.md documents how).
      - PROTOMAPS_BUILD_URL=${PROTOMAPS_BUILD_URL:-https://build.protomaps.com/20260829.pmtiles}
      # Germany bounding box (min_lon,min_lat,max_lon,max_lat).
      - GERMANY_BBOX=${GERMANY_BBOX:-5.8,47.2,15.1,55.1}
      - GO_PMTILES_VERSION=1.31.2
    volumes:
      - ./tiles:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Note: `$` is written as `$$` because docker-compose interpolates a
        # single `$` from the host environment (the script must see the
        # literal shell variable instead) — see the entrypoint comment this
        # replaced (the old `martin` service) for the same gotcha.
        set -eu
        if [ "$${SKIP_TILES:-0}" = "1" ]; then
          echo "SKIP_TILES=1 — skipping tile extraction"
          exit 0
        fi
        if [ -f /data/map.pmtiles ]; then
          echo "tiles/map.pmtiles already exists — skipping extraction"
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        cd /tmp
        echo "Downloading pmtiles CLI v$${GO_PMTILES_VERSION} ..."
        curl -fL -o pmtiles.tar.gz \
          "https://github.com/protomaps/go-pmtiles/releases/download/v$${GO_PMTILES_VERSION}/go-pmtiles_$${GO_PMTILES_VERSION}_Linux_x86_64.tar.gz"
        tar -xzf pmtiles.tar.gz pmtiles
        chmod +x pmtiles
        # The remote extract streams several GB over HTTP/2 range requests,
        # which occasionally drops with a transient stream error; retry a few
        # times rather than failing the whole (slow) extraction outright.
        extract_with_retry() {
          attempt=1
          while [ "$$attempt" -le 3 ]; do
            if ./pmtiles extract "$$@"; then
              return 0
            fi
            echo "extract failed (attempt $$attempt/3), retrying ..."
            attempt=$$((attempt + 1))
          done
          return 1
        }
        echo "Extracting the worldwide backdrop (z0-5) ..."
        extract_with_retry "$${PROTOMAPS_BUILD_URL}" /data/world.pmtiles --maxzoom=5
        echo "Extracting the Germany detail (z6-15, bbox=$${GERMANY_BBOX}) ..."
        extract_with_retry "$${PROTOMAPS_BUILD_URL}" /data/germany.pmtiles \
          --bbox="$${GERMANY_BBOX}" --minzoom=6 --maxzoom=15
        echo "Merging into tiles/map.pmtiles ..."
        ./pmtiles merge /data/world.pmtiles /data/germany.pmtiles /data/map.pmtiles
        rm -f /data/world.pmtiles /data/germany.pmtiles
        echo "tiles/map.pmtiles ready"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bike_counter_frontend
    restart: unless-stopped
    depends_on:
      # Only require the backend container to be running. Readiness can report
      # 503 while a data-source provider is temporarily unreachable, which
      # would otherwise leave the frontend waiting forever; the nginx config
      # resolves the backend hostname at request time and handles that.
      backend:
        condition: service_started
      tiles:
        condition: service_completed_successfully
    volumes:
      - ./tiles:/usr/share/nginx/html/tiles:ro
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # Internal network shared only by the backend and MinIO. `internal: true`
  # disables external access and, together with explicit network membership,
  # keeps MinIO unreachable from db/frontend on the default network.
  asset_network:
    internal: true

volumes:
  postgres_data:
  minio_data:
