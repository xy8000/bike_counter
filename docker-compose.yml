services:
  db:
    # Postgres 18 (latest stable major). Upgrading a major version does NOT
    # migrate an existing `postgres_data` volume in place: re-create the volume
    # (`docker compose down -v`) or migrate the data manually.
    image: postgres:18-alpine
    container_name: bike_counter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bike_counter
    volumes:
      - postgres_data:/var/lib/postgresql
    # Reachable only from within the dedicated internal `db_network`
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bike_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Published image name (see .github/workflows/release.yml). The `build:`
    # block stays alongside `image:` so `docker compose up --build` (make run)
    # keeps building from source for development, while `docker compose pull`
    # fetches the released image.
    image: xy8000/bike-counter-backend:0.0.1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike_counter_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./config.toml:/app/config.toml:ro
      # Host tiles dir, writable so the backend can build the basemap; the
      # frontend mounts the same dir read-only.
      - ./tiles:/data
    ports:
      - "8080:8080"
    networks:
      - default
      - asset_network
      - db_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Private S3-compatible object storage for counting-station images. Reachable
  # only from within the dedicated internal `asset_network` (i.e. only the
  # backend); no host port is published. The backend streams image content to
  # the browser via the BFF, so MinIO is never exposed directly.
  minio:
    image: minio/minio:latest
    container_name: bike_counter_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - asset_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket provisioning using the MinIO client (`mc`). The backend
  # waits for it to finish before starting, so the image bucket always exists.
  minio-init:
    image: minio/mc:latest
    container_name: bike_counter_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - asset_network
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bike-counter-images &&
      mc mb --ignore-existing local/bike-counter-opendata
      "

  frontend:
    # Published image name (see .github/workflows/release.yml); `build:` stays
    # for local development via `docker compose up --build` (make run).
    image: xy8000/bike-counter-frontend:0.0.1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bike_counter_frontend
    restart: unless-stopped
    depends_on:
      # Wait for the backend to be fully ready. The backend only reports ready
      # (and only starts its HTTP server) once the database is migrated and the
      # basemap exists, so the frontend never serves a map without tiles.
      backend:
        condition: service_healthy
    volumes:
      - ./tiles:/usr/share/nginx/html/tiles:ro
    ports:
      - "8081:80"
    healthcheck:
      # `localhost` resolves to IPv6 `::1` in the nginx alpine image while nginx
      # only listens on IPv4 (`listen 80`), so probe 127.0.0.1 explicitly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # Internal network shared only by the backend and MinIO. `internal: true`
  # disables external access and, together with explicit network membership,
  # keeps MinIO unreachable from db/frontend on the default network.
  asset_network:
    internal: true
  # Internal network shared only by the backend and PostgreSQL. `internal: true`
  # plus explicit membership keeps the database unreachable from minio/frontend
  # and from the host (no published port).
  db_network:
    internal: true

volumes:
  postgres_data:
  minio_data:
